[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ollama2cpp"
version = "0.1.1"
description = "Console app to start llama.cpp (llama-server) from Ollama available models"
requires-python = ">=3.12"
authors = [{ name = "Jorge Albuquerque" }]
license = { text = "MIT" }
keywords = ["llm", "ollama", "llama.cpp", "llama-server", "gguf"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "psutil>=7",
    "rich>=15.0.0",
    "typer>=0.29.2",
]

[project.scripts]
ollama2cpp = "ollama2cpp.__main__:main"

[tool.setuptools]
packages = ["ollama2cpp"]

[tool.setuptools.package-dir]
"" = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --strict-markers --cov=src/ollama2cpp --cov-report=term-missing --cov-fail-under=90"
markers = [
    "slow: marks tests as slow",
    "live: hits real external services (Ollama / llama-server); deselected by default",
]

[tool.coverage.run]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]

[tool.pyrefly]
project-includes = ["src/**/*.py", "tests/**/*.py"]
search-path = ["src", "."]

[dependency-groups]
dev = [
    "pyrefly>=1.5.0",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.6"
]
